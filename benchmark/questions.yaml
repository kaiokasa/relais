- id: P08
  categorie: piege_causal
  question: Est-ce que l'arrivée de la fibre fait augmenter le niveau de vie des communes ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, relecteur]
  sql_reference: |
    SELECT r.niveau_vie_median, 1.0 * f.locaux_eligibles_ftth / f.nb_locaux AS taux_ftth
    FROM fixe_technologies f JOIN revenus_communes r USING (code_insee)
    WHERE f.trimestre = '2026_T2' AND f.nb_locaux > 0 AND r.niveau_vie_median IS NOT NULL
  calcul_reference: |
    df = resultats[0]
    valeurs = {"rho_spearman": round(stats.spearmanr(df.niveau_vie_median, df.taux_ftth)[0], 3)}
  tolerance_abs: 0.01
  mentions: ['corr[ée]lation|associ', 'causal|causalité|cause']
  interdits: ['la fibre (fait )?(augmente|augmenter|accro[îi]t)']
  piege: >-
    Une seule année de revenus et une corrélation transversale ne permettent pas de conclure à un effet causal.

- id: P09
  categorie: piege_causal
  question: Les zones blanches font-elles fuir les habitants ?
  statut_attendu: impossible
  parcours_attendu: [planificateur, relecteur]
  mentions: ['population']
  piege: La base n'a qu'une année de population ; aucune évolution démographique ne peut être mesurée.

- id: P10
  categorie: piege_causal
  question: >-
    Orange déclare plus d'indisponibilités de sites que les autres opérateurs : est-ce parce que son réseau est de
    moins bonne qualité ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, relecteur]
  sql_reference: |
    WITH p AS (SELECT operateur_code, count(*) AS indisponibilites FROM mobile_pannes
               WHERE operateur_code IS NOT NULL GROUP BY 1),
         s AS (SELECT operateur_code, count(*) AS sites FROM mobile_sites
               WHERE trimestre = '2026_T2' AND territoire = 'metropole' GROUP BY 1)
    SELECT o.nom AS operateur, round(100.0 * indisponibilites / sites, 1) AS pour_100_sites
    FROM p JOIN s USING (operateur_code) JOIN operateurs o USING (operateur_code) ORDER BY o.nom
  mentions: ['site', 'déclar']
  interdits: ['(est|a) (un réseau )?de moins bonne qualité']
  piege: >-
    Les volumes dépendent du nombre de sites et des pratiques de déclaration ; un nombre d'indisponibilités ne
    mesure pas la qualité d'un réseau.

- id: P11
  categorie: piege_operateurs
  question: >-
    Selon la campagne ARCEP 2025, quel opérateur offre la plus forte part de téléchargements à plus de 30 Mbit/s
    en zones rurales ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, relecteur]
  sql_reference: |
    SELECT operateur, round(100 * valeur, 1) AS part_pct, round(100 * precision, 1) AS precision_pct
    FROM mobile_qos_indicateurs
    WHERE annee = 2025 AND strate = 'Zones rurales' AND situation = 'Tous usages' AND service = 'DL250'
      AND indicateur LIKE '%> 30Mbs/s' AND operateur <> 'Moyenne'
    ORDER BY operateur
  calcul_reference: |
    df = resultats[0]
    valeurs = {f"part_{o}": v for o, v in zip(df.operateur, df.part_pct)}
  mentions: ['précision|intervalle|marge']
  interdits: ['meilleur opérateur']
  piege: Comparer avec la précision statistique publiée ; rester factuel, sans désigner de "meilleur" opérateur.

- id: P12
  categorie: piege_operateurs
  question: Quel opérateur a le plus de sites 5G en métropole au 2e trimestre 2026 ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, relecteur]
  sql_reference: |
    SELECT o.nom AS operateur, count(*) FILTER (WHERE m.site_5g) AS sites_5g
    FROM mobile_sites m JOIN operateurs o USING (operateur_code)
    WHERE m.trimestre = '2026_T2' AND m.territoire = 'metropole' GROUP BY o.nom ORDER BY o.nom
  interdits: ['meilleure? (couverture|réseau)']
  piege: Un nombre de sites ne dit rien de la couverture ni de la qualité ressentie.
