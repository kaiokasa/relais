# Jeu de questions de Relais : réponse de référence ET parcours attendu.
#
# Champs (validés par relais/benchmark.py) :
#   id, categorie, question
#   statut_attendu     repondu | clarification | impossible
#   parcours_attendu   suite des agents : modèle de référence du conformance checking
#   sql_reference      une requête, ou une liste de requêtes (questions en plusieurs étapes)
#   calcul_reference   code Python facultatif : reçoit `resultats` (liste de DataFrames) et `stats` (scipy.stats),
#                      remplit le dictionnaire `valeurs`. Sans calcul : une ligne -> ses colonnes ; deux colonnes
#                      -> {libellé: valeur}.
#   valeurs_attendues  clés de `valeurs` que la réponse doit donner (toutes par défaut) ; un texte doit apparaître,
#                      un nombre doit être retrouvé à la tolérance près (taux acceptés en 0-1 ou en %).
#   mentions           expressions régulières qui doivent toutes apparaître dans la réponse
#   interdits          expressions régulières qui ne doivent pas apparaître
#   graphique          type attendu (line, bar, scatter, box, histogram) et nombre de séries facultatif
#   piege              ce que la question teste
#
# Les réponses de référence sont calculées par benchmark/build_references.py et figées dans
# benchmark/references.json.

# ------------------------------------------------------------------------------------------- SQL seul

- id: Q01
  categorie: sql
  question: Quelle part des locaux est éligible à la fibre jusqu'à l'abonné (FttH) en France au 2e trimestre 2026 ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, relecteur]
  sql_reference: |
    SELECT round(100.0 * sum(locaux_eligibles_ftth) / sum(nb_locaux), 2) AS taux_ftth_pct
    FROM fixe_technologies WHERE trimestre = '2026_T2'
  piege: Un taux national se calcule sur la somme des locaux, pas en moyenne des taux communaux.

- id: Q02
  categorie: sql
  question: Combien de locaux n'ont toujours pas accès au haut débit (moins de 512 kbit/s) au 2e trimestre 2026 ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, relecteur]
  sql_reference: |
    SELECT sum(locaux_sans_haut_debit) AS locaux_sans_haut_debit
    FROM fixe_debits WHERE trimestre = '2026_T2'

- id: Q03
  categorie: sql
  question: Quel département de métropole a le plus faible taux d'éligibilité à la fibre FttH au 2e trimestre 2026 ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, relecteur]
  sql_reference: |
    SELECT d.nom AS departement,
           round(100.0 * sum(f.locaux_eligibles_ftth) / sum(f.nb_locaux), 2) AS taux_ftth_pct
    FROM fixe_technologies f
    JOIN communes c USING (code_insee)
    JOIN departements d USING (dep_code)
    WHERE f.trimestre = '2026_T2' AND d.dep_code NOT LIKE '97%'
    GROUP BY d.nom ORDER BY taux_ftth_pct LIMIT 1
  piege: Exclure l'outre-mer ; agréger les locaux par département avant de diviser.

- id: Q04
  categorie: sql
  question: Combien de communes ont la totalité de leurs locaux éligibles à la fibre FttH au 2e trimestre 2026 ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, relecteur]
  sql_reference: |
    SELECT count(*) AS communes_100pct_ftth
    FROM fixe_technologies
    WHERE trimestre = '2026_T2' AND nb_locaux > 0 AND locaux_eligibles_ftth = nb_locaux

- id: Q05
  categorie: sql
  question: >-
    Au 2e trimestre 2026, quelle part des locaux peut avoir au moins 1 Gbit/s dans les communes rurales, urbaines
    intermédiaires et urbaines denses ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, relecteur]
  sql_reference: |
    SELECT c.libelle_densite, round(100.0 * sum(d.locaux_1g_ou_plus) / sum(d.nb_locaux), 2) AS taux_1g_pct
    FROM fixe_debits d JOIN communes c USING (code_insee)
    WHERE d.trimestre = '2026_T2'
    GROUP BY c.libelle_densite ORDER BY c.libelle_densite
  piege: Classes de débit cumulatives ; taux par classe de densité calculé sur les sommes.

