# ------------------------------------------------------------------------------------------- équipe complète

- id: E01
  categorie: equipe
  question: >-
    Les départements de métropole où le niveau de vie médian est plus élevé ont-ils un meilleur taux d'éligibilité
    FttH au 2e trimestre 2026 ? Montre la relation et mesure-la.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, visualisation, relecteur]
  sql_reference: |
    SELECT t.code_geo AS departement, t.niveau_vie_median,
           100.0 * sum(f.locaux_eligibles_ftth) / sum(f.nb_locaux) AS taux_ftth_pct
    FROM fixe_technologies f JOIN communes c USING (code_insee)
    JOIN revenus_territoires t ON t.niveau = 'departement' AND t.code_geo = c.dep_code
    WHERE f.trimestre = '2026_T2'
    GROUP BY t.code_geo, t.niveau_vie_median
  calcul_reference: |
    df = resultats[0]
    valeurs = {"rho_spearman": round(stats.spearmanr(df.niveau_vie_median, df.taux_ftth_pct)[0], 3),
               "departements": len(df)}
  tolerance_abs: 0.01
  graphique: {type: scatter}
  mentions: ['corr[ée]lation']

- id: E02
  categorie: equipe
  question: >-
    Comment a évolué l'écart de taux d'éligibilité FttH entre communes urbaines denses et communes rurales depuis
    2019 ? Montre-le et quantifie la tendance.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, visualisation, relecteur]
  sql_reference: |
    SELECT f.date_fin_trimestre,
           100.0 * sum(f.locaux_eligibles_ftth) FILTER (WHERE c.densite = 1) / sum(f.nb_locaux) FILTER (WHERE c.densite = 1)
         - 100.0 * sum(f.locaux_eligibles_ftth) FILTER (WHERE c.densite = 3) / sum(f.nb_locaux) FILTER (WHERE c.densite = 3)
           AS ecart_points
    FROM fixe_technologies f JOIN communes c USING (code_insee)
    GROUP BY f.date_fin_trimestre ORDER BY f.date_fin_trimestre
  calcul_reference: |
    df = resultats[0]
    valeurs = {"ecart_2019_T3": round(df.ecart_points.iat[0], 1), "ecart_2026_T2": round(df.ecart_points.iat[-1], 1)}
  tolerance_abs: 0.15
  graphique: {type: line}

- id: E03
  categorie: equipe
  question: >-
    Rapporté au nombre de sites, le nombre d'indisponibilités de sites mobiles varie-t-il selon la densité des
    communes ? Calcule les indisponibilités pour 100 sites (sites déclarés au 2e trimestre 2026) par classe de
    densité, montre-les et teste la différence.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, visualisation, relecteur]
  sql_reference: |
    WITH p AS (SELECT c.libelle_densite, count(*) AS indisponibilites
               FROM mobile_pannes m JOIN communes c USING (code_insee) GROUP BY 1),
         s AS (SELECT c.libelle_densite, count(*) AS sites
               FROM mobile_sites m JOIN communes c USING (code_insee) WHERE m.trimestre = '2026_T2' GROUP BY 1)
    SELECT libelle_densite, indisponibilites, sites FROM p JOIN s USING (libelle_densite) ORDER BY 1
  calcul_reference: |
    df = resultats[0]
    valeurs = {f"pour_100_sites_{n}": round(100 * i / s, 1) for n, i, s in
               zip(df.libelle_densite, df.indisponibilites, df.sites)}
  graphique: {type: bar}
  mentions: ['significati|test']
  piege: Comparer des taux rapportés au parc de sites, pas des nombres bruts.

- id: E04
  categorie: equipe
  question: >-
    Montre la part des locaux pouvant avoir au moins 1 Gbit/s selon les 7 niveaux de densité au 2e trimestre 2026,
    et mesure si elle diminue quand la densité baisse.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, visualisation, relecteur]
  sql_reference: |
    SELECT c.densite_7, c.libelle_densite_7,
           100.0 * sum(d.locaux_1g_ou_plus) / sum(d.nb_locaux) AS taux_1g_pct
    FROM fixe_debits d JOIN communes c USING (code_insee)
    WHERE d.trimestre = '2026_T2' GROUP BY ALL ORDER BY c.densite_7
  calcul_reference: |
    df = resultats[0]
    valeurs = {"rho_spearman": round(stats.spearmanr(df.densite_7, df.taux_1g_pct)[0], 3),
               "taux_grands_centres_urbains": round(df.taux_1g_pct.iat[0], 1),
               "taux_rural_tres_disperse": round(df.taux_1g_pct.iat[-1], 1)}
  tolerance_abs: 0.15
  graphique: {type: bar}
  piege: Avec 7 points, une corrélation de rang reste indicative.

- id: E05
  categorie: equipe
  question: >-
    Lors de la campagne ARCEP 2025, le débit descendant mesuré à l'intérieur des bâtiments est-il plus faible qu'à
    l'extérieur ? Montre les deux distributions et teste la différence.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, visualisation, relecteur]
  sql_reference: |
    SELECT situation, debit_descendant_mbps FROM mobile_qos_mesures
    WHERE protocole = 'DOWNLOAD' AND debit_descendant_mbps IS NOT NULL
  calcul_reference: |
    df = resultats[0]
    interieur = df[df.situation == "Indoor"].debit_descendant_mbps
    exterieur = df[df.situation == "Outdoor"].debit_descendant_mbps
    u, p = stats.mannwhitneyu(interieur, exterieur)
    valeurs = {"mediane_interieur_mbps": round(interieur.median(), 1),
               "mediane_exterieur_mbps": round(exterieur.median(), 1), "p_valeur_inferieure_0_001": bool(p < 0.001)}
  graphique: {type: box, series: 2}
  mentions: ['significati']

- id: E06
  categorie: equipe
  question: >-
    Au 2e trimestre 2026, la part des sites mobiles équipés en 5G est-elle plus faible dans les régions de
    métropole les plus rurales ? Utilise la part de la population vivant dans une commune rurale, montre la
    relation et mesure-la.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, visualisation, relecteur]
  sql_reference: |
    WITH pop AS (SELECT reg_code, 100.0 * sum(population) FILTER (WHERE densite = 3) / sum(population) AS part_rurale_pct
                 FROM communes GROUP BY reg_code),
         sites AS (SELECT c.reg_code, 100.0 * count(*) FILTER (WHERE m.site_5g) / count(*) AS part_5g_pct
                   FROM mobile_sites m JOIN communes c USING (code_insee)
                   WHERE m.trimestre = '2026_T2' AND m.territoire = 'metropole' GROUP BY c.reg_code)
    SELECT reg_code, part_rurale_pct, part_5g_pct FROM pop JOIN sites USING (reg_code)
  calcul_reference: |
    df = resultats[0]
    valeurs = {"rho_spearman": round(stats.spearmanr(df.part_rurale_pct, df.part_5g_pct)[0], 3), "regions": len(df)}
  tolerance_abs: 0.01
  graphique: {type: scatter}
  piege: Avec 13 régions, la corrélation est fragile ; la réponse doit le dire.

# ------------------------------------------------------------------------------------------- plusieurs étapes

- id: M01
  categorie: multi_etapes
  question: >-
    Quel département de métropole a le plus progressé en taux d'éligibilité FttH entre le 4e trimestre 2022 et le
    2e trimestre 2026, et quel est son niveau de vie médian ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, sql, relecteur]
  sql_reference:
    - |
      SELECT c.dep_code, d.nom AS departement,
             100.0 * sum(f.locaux_eligibles_ftth) FILTER (WHERE f.trimestre = '2026_T2')
                   / sum(f.nb_locaux) FILTER (WHERE f.trimestre = '2026_T2')
           - 100.0 * sum(f.locaux_eligibles_ftth) FILTER (WHERE f.trimestre = '2022_T4')
                   / sum(f.nb_locaux) FILTER (WHERE f.trimestre = '2022_T4') AS progression_points
      FROM fixe_technologies f JOIN communes c USING (code_insee) JOIN departements d USING (dep_code)
      WHERE c.dep_code NOT LIKE '97%' GROUP BY ALL ORDER BY progression_points DESC LIMIT 1
    - |
      SELECT t.code_geo AS dep_code, t.niveau_vie_median FROM revenus_territoires t WHERE t.niveau = 'departement'
  calcul_reference: |
    top = resultats[0].iloc[0]
    median = resultats[1].set_index("dep_code").niveau_vie_median[top.dep_code]
    valeurs = {"departement": top.departement, "progression_points": round(top.progression_points, 1),
               "niveau_vie_median": float(median)}
  tolerance_abs: 0.15

- id: M02
  categorie: multi_etapes
  question: >-
    Combien de communes de plus de 5 000 habitants ont encore moins de 80 % de locaux éligibles à la fibre FttH au
    2e trimestre 2026 ? Combien d'entre elles sont rurales, et quelle population totale représentent-elles toutes ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, relecteur]
  sql_reference: |
    SELECT count(*) AS communes, count(*) FILTER (WHERE c.densite = 3) AS communes_rurales,
           sum(c.population) AS population
    FROM fixe_technologies f JOIN communes c USING (code_insee)
    WHERE f.trimestre = '2026_T2' AND c.population > 5000 AND f.locaux_eligibles_ftth < 0.8 * f.nb_locaux

- id: M03
  categorie: multi_etapes
  question: >-
    Quelle région compte le plus de sites mobiles pour 10 000 habitants au 2e trimestre 2026 (tous opérateurs), et
    combien d'indisponibilités de sites y ont été relevées sur la période couverte ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, sql, relecteur]
  sql_reference:
    - |
      SELECT g.reg_code, g.nom AS region, 10000.0 * count(*) / max(p.population) AS sites_pour_10000_hab
      FROM mobile_sites m JOIN communes c USING (code_insee) JOIN regions g USING (reg_code)
      JOIN (SELECT reg_code, sum(population) AS population FROM communes GROUP BY reg_code) p USING (reg_code)
      WHERE m.trimestre = '2026_T2' GROUP BY g.reg_code, g.nom ORDER BY sites_pour_10000_hab DESC LIMIT 1
    - |
      SELECT c.reg_code, count(*) AS indisponibilites FROM mobile_pannes m JOIN communes c USING (code_insee)
      GROUP BY c.reg_code
  calcul_reference: |
    top = resultats[0].iloc[0]
    pannes = resultats[1].set_index("reg_code").indisponibilites.get(top.reg_code, 0)
    valeurs = {"region": top.region, "sites_pour_10000_hab": round(top.sites_pour_10000_hab, 1),
               "indisponibilites": int(pannes)}

- id: M04
  categorie: multi_etapes
  question: >-
    Quelle est la commune la plus peuplée où moins de la moitié des locaux peuvent avoir 1 Gbit/s au 2e trimestre
    2026 ? Donne ensuite son taux d'éligibilité FttH et le nombre de sites 4G déclarés sur son territoire.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, sql, relecteur]
  sql_reference:
    - |
      SELECT c.code_insee, c.nom AS commune, c.population,
             round(100.0 * f.locaux_eligibles_ftth / f.nb_locaux, 1) AS taux_ftth_pct
      FROM fixe_debits d JOIN fixe_technologies f USING (trimestre, code_insee) JOIN communes c USING (code_insee)
      WHERE d.trimestre = '2026_T2' AND d.locaux_1g_ou_plus < 0.5 * d.nb_locaux
      ORDER BY c.population DESC LIMIT 1
    - |
      SELECT code_insee, count(*) FILTER (WHERE site_4g) AS sites_4g FROM mobile_sites
      WHERE trimestre = '2026_T2' GROUP BY code_insee
  calcul_reference: |
    top = resultats[0].iloc[0]
    sites = resultats[1].set_index("code_insee").sites_4g.get(top.code_insee, 0)
    valeurs = {"commune": top.commune, "taux_ftth_pct": float(top.taux_ftth_pct), "sites_4g": int(sites)}

- id: M05
  categorie: multi_etapes
  question: >-
    Combien de communes accueillent au moins un site du programme zones blanches centres-bourgs au 2e trimestre
    2026, et quel est le taux global d'éligibilité FttH de ces communes ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, sql, relecteur]
  sql_reference:
    - |
      SELECT DISTINCT code_insee FROM mobile_sites WHERE trimestre = '2026_T2' AND zone_blanche
    - |
      SELECT code_insee, nb_locaux, locaux_eligibles_ftth FROM fixe_technologies WHERE trimestre = '2026_T2'
  calcul_reference: |
    codes = set(resultats[0].code_insee)
    fixe = resultats[1][resultats[1].code_insee.isin(codes)]
    valeurs = {"communes": len(codes),
               "taux_ftth_pct": round(100 * fixe.locaux_eligibles_ftth.sum() / fixe.nb_locaux.sum(), 1)}
  piege: Taux global de ces communes = somme des éligibles sur somme des locaux, pas moyenne des taux.

