- id: Q12
  categorie: sql
  question: >-
    De combien de points le taux national d'éligibilité à la fibre FttH a-t-il progressé entre le 3e trimestre 2019
    et le 2e trimestre 2026 ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, relecteur]
  sql_reference: |
