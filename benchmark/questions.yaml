               "progression_points": round(fin - debut, 2)}

# ------------------------------------------------------------------------------------------- SQL + statistiques

- id: S01
  categorie: sql_stats
  question: >-
    Au 2e trimestre 2026, le taux d'éligibilité FttH des communes est-il corrélé à leur niveau de vie médian ?
    Donne la corrélation de Spearman et le nombre de communes utilisées.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, relecteur]
  sql_reference: |
    SELECT r.niveau_vie_median, 1.0 * f.locaux_eligibles_ftth / f.nb_locaux AS taux_ftth
    FROM fixe_technologies f JOIN revenus_communes r USING (code_insee)
    WHERE f.trimestre = '2026_T2' AND f.nb_locaux > 0 AND r.niveau_vie_median IS NOT NULL
  calcul_reference: |
    df = resultats[0]
    rho, p = stats.spearmanr(df.niveau_vie_median, df.taux_ftth)
    valeurs = {"rho_spearman": round(rho, 3), "communes": len(df)}
  tolerance_abs: 0.01
  piege: Le niveau de vie n'est diffusé que pour une partie des communes (secret statistique).

- id: S02
  categorie: sql_stats
  question: >-
    Le taux d'éligibilité FttH des communes au 2e trimestre 2026 diffère-t-il significativement selon leur niveau
    de densité (3 classes) ? Donne la médiane des taux communaux par classe.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, relecteur]
  sql_reference: |
    SELECT c.libelle_densite, 100.0 * f.locaux_eligibles_ftth / f.nb_locaux AS taux_ftth_pct
    FROM fixe_technologies f JOIN communes c USING (code_insee)
    WHERE f.trimestre = '2026_T2' AND f.nb_locaux > 0
  calcul_reference: |
    df = resultats[0]
    groupes = {nom: g.taux_ftth_pct for nom, g in df.groupby("libelle_densite")}
    h, p = stats.kruskal(*groupes.values())
    valeurs = {f"mediane_{nom}": round(g.median(), 1) for nom, g in groupes.items()}
    valeurs["p_valeur_inferieure_0_001"] = bool(p < 0.001)
  valeurs_attendues: [mediane_Rural, mediane_Urbain dense, mediane_Urbain intermédiaire]
  mentions: ['significati']
  tolerance_abs: 0.15

- id: S03
  categorie: sql_stats
  question: >-
    À densité égale, le niveau de vie médian des communes est-il associé à leur taux d'éligibilité FttH au 2e
    trimestre 2026 ? Donne la corrélation de Spearman dans chaque classe de densité (3 classes).
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, relecteur]
  sql_reference: |
    SELECT c.libelle_densite, r.niveau_vie_median, 1.0 * f.locaux_eligibles_ftth / f.nb_locaux AS taux_ftth
    FROM fixe_technologies f
    JOIN revenus_communes r USING (code_insee) JOIN communes c USING (code_insee)
    WHERE f.trimestre = '2026_T2' AND f.nb_locaux > 0 AND r.niveau_vie_median IS NOT NULL
  calcul_reference: |
    valeurs = {}
    for nom, g in resultats[0].groupby("libelle_densite"):
        valeurs[f"rho_{nom}"] = round(stats.spearmanr(g.niveau_vie_median, g.taux_ftth)[0], 3)
  tolerance_abs: 0.01
  piege: Contrôler un facteur de confusion (la densité) en stratifiant.

- id: S04
  categorie: sql_stats
  question: >-
    Lors de la campagne ARCEP 2025, quel est le débit descendant moyen mesuré par les tests de téléchargement en
    zones rurales, avec son intervalle de confiance à 95 % ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, relecteur]
  sql_reference: |
    SELECT debit_descendant_mbps FROM mobile_qos_mesures
    WHERE protocole = 'DOWNLOAD' AND zone = 'Zones rurales' AND debit_descendant_mbps IS NOT NULL
  calcul_reference: |
    x = resultats[0].debit_descendant_mbps
    moyenne, erreur = x.mean(), stats.sem(x)
    bas, haut = stats.t.interval(0.95, len(x) - 1, loc=moyenne, scale=erreur)
    valeurs = {"moyenne_mbps": round(moyenne, 2), "ic95_bas": round(bas, 2), "ic95_haut": round(haut, 2),
               "tests": len(x)}
  valeurs_attendues: [moyenne_mbps, ic95_bas, ic95_haut]
  tolerance_abs: 0.1
  piege: Moyenne des tests, pas moyenne des moyennes communales.

- id: S05
  categorie: sql_stats
  question: >-
    Les incidents de sites mobiles restent-ils visibles plus longtemps que les maintenances programmées ? Compare
    le nombre moyen de jours où ils apparaissent dans les relevés quotidiens, la part qui dépasse 7 jours, et teste
    la différence.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, relecteur]
  sql_reference: |
    SELECT raison, nb_jours_observes FROM mobile_pannes WHERE raison IN ('INT', 'MAINT')
  calcul_reference: |
    df = resultats[0]
    inc, maint = df[df.raison == "INT"].nb_jours_observes, df[df.raison == "MAINT"].nb_jours_observes
    u, p = stats.mannwhitneyu(inc, maint)
    valeurs = {"moyenne_jours_incidents": round(inc.mean(), 2), "moyenne_jours_maintenances": round(maint.mean(), 2),
               "part_plus_7_jours_incidents_pct": round(100 * (inc > 7).mean(), 1),
               "part_plus_7_jours_maintenances_pct": round(100 * (maint > 7).mean(), 1),
               "p_valeur_inferieure_0_05": bool(p < 0.05)}
  mentions: ['significati']
  piege: Les incidents encore en cours au dernier relevé ont une durée tronquée.

- id: S06
  categorie: sql_stats
  question: >-
    De 2022 à 2026, à quel rythme le taux national d'éligibilité FttH a-t-il progressé ? Estime la pente d'une
    régression linéaire du taux sur le temps, en points par an.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, relecteur]
  sql_reference: |
    SELECT date_fin_trimestre, 100.0 * sum(locaux_eligibles_ftth) / sum(nb_locaux) AS taux_ftth_pct
    FROM fixe_technologies WHERE trimestre >= '2022_T1'
    GROUP BY date_fin_trimestre ORDER BY date_fin_trimestre
  calcul_reference: |
    df = resultats[0]
    annees = (df.date_fin_trimestre - df.date_fin_trimestre.min()).dt.days / 365.25
    fit = stats.linregress(annees, df.taux_ftth_pct)
    valeurs = {"pente_points_par_an": round(fit.slope, 2), "r2": round(fit.rvalue ** 2, 3)}
  valeurs_attendues: [pente_points_par_an]
  tolerance_abs: 0.1
  piege: Un trimestre manque (2023_T3) ; utiliser les dates, pas un numéro de trimestre.

- id: S07
  categorie: sql_stats
  question: Quel est le taux de pauvreté moyen des communes de France métropolitaine ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, relecteur]
  sql_reference:
    - |
      SELECT count(*) FILTER (WHERE r.statut_taux_pauvrete = 'diffusé') AS communes_diffusees,
             round(100.0 * sum(c.population) FILTER (WHERE r.statut_taux_pauvrete = 'diffusé')
                   / sum(c.population), 1) AS part_population_couverte_pct
      FROM revenus_communes r JOIN communes c USING (code_insee)
    - |
      SELECT taux_pauvrete AS taux_pauvrete_france FROM revenus_territoires WHERE niveau = 'france_metropolitaine'
  calcul_reference: |
    valeurs = {**resultats[0].iloc[0].to_dict(), **resultats[1].iloc[0].to_dict()}
  mentions: ['secret statistique']
  piege: >-
    Le taux n'est diffusé que pour une minorité de communes (les plus peuplées) : une moyenne des communes
    diffusées serait biaisée ; le taux métropolitain publié par l'INSEE est la bonne réponse.

- id: S08
  categorie: sql_stats
  question: >-
    Lors de la campagne ARCEP 2025, la part des appels maintenus 2 minutes sans perturbation audible dépend-elle de
    la situation de l'appel (intérieur, extérieur, en voiture) ? Donne le taux par situation et teste
    l'indépendance.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, relecteur]
  sql_reference: |
    SELECT situation, communication_sans_perturbation, count(*) AS appels
    FROM mobile_qos_mesures
    WHERE protocole = 'VOIX' AND communication_sans_perturbation IS NOT NULL
    GROUP BY ALL ORDER BY ALL
  calcul_reference: |
    table = resultats[0].pivot(index="situation", columns="communication_sans_perturbation", values="appels")
    chi2, p, ddl, attendu = stats.chi2_contingency(table)
    valeurs = {f"taux_{s}_pct": round(100 * table.loc[s, True] / table.loc[s].sum(), 1) for s in table.index}
    valeurs["p_valeur_inferieure_0_001"] = bool(p < 0.001)
  valeurs_attendues: [taux_Incar_pct, taux_Indoor_pct, taux_Outdoor_pct]
  mentions: ['significati|indépendan']

