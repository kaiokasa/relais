  question: >-
    Au niveau national, quelle part des raccordements à la fibre a été mise en service en moins de 60 jours lors du
    dernier mois publié par l'ARCEP ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, planificateur, relecteur]
