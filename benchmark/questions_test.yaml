# Lot de TEST de Relais : 24 questions écrites après le premier benchmark, sur lesquelles l'équipe n'a jamais été
# lancée pendant la mise au point. Les améliorations de l'équipe se font en regardant uniquement le lot de
# développement (questions.yaml) ; ce lot ne sert qu'à mesurer, avant et après. Même format que questions.yaml.

# ------------------------------------------------------------------------------------------- SQL seul

- id: T01
  categorie: sql
  question: Combien de locaux sont éligibles au câble (réseau coaxial) en France au 2e trimestre 2026 ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, planificateur, relecteur]
  sql_reference: |
    SELECT sum(locaux_eligibles_cable)::BIGINT AS locaux_cable
    FROM fixe_technologies WHERE trimestre = '2026_T2'

- id: T02
  categorie: sql
  question: >-
    Quel département compte le plus de locaux sans accès au haut débit (moins de 512 kbit/s) au 2e trimestre 2026,
    et combien ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, planificateur, relecteur]
  sql_reference: |
    SELECT d.nom AS departement, sum(f.locaux_sans_haut_debit)::BIGINT AS locaux_sans_haut_debit
    FROM fixe_debits f JOIN communes c USING (code_insee) JOIN departements d USING (dep_code)
    WHERE f.trimestre = '2026_T2' GROUP BY d.nom ORDER BY locaux_sans_haut_debit DESC LIMIT 1

- id: T03
