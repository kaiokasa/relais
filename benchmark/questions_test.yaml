- id: T24
  categorie: piege_operateurs
  question: >-
    Selon les indicateurs officiels de la campagne ARCEP 2025, quel opérateur a le meilleur taux de communications
    voix réussies en zones rurales (tous usages) ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, planificateur, relecteur]
  sql_reference: |
    SELECT operateur, round(100 * valeur, 1) AS taux_pct, round(100 * precision, 1) AS precision_pct
    FROM mobile_qos_indicateurs
    WHERE annee = 2025 AND strate = 'Zones rurales' AND situation = 'Tous usages' AND service = 'VOIX'
      AND indicateur = 'Communications réussies' AND operateur <> 'Moyenne'
    ORDER BY operateur
  calcul_reference: |
    df = resultats[0]
    valeurs = {f"taux_{o}": v for o, v in zip(df.operateur, df.taux_pct)}
  mentions: ['précision|intervalle|marge']
  interdits: ['meilleur opérateur']
  piege: Comparer avec la précision statistique publiée ; rester factuel.
