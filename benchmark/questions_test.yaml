- id: T06
  categorie: sql
  question: Quel est le taux de pauvreté dans le département du Nord, comparé à celui de la France métropolitaine ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, planificateur, relecteur]
  sql_reference: |
    SELECT max(taux_pauvrete) FILTER (WHERE niveau = 'departement' AND code_geo = '59') AS taux_nord,
           max(taux_pauvrete) FILTER (WHERE niveau = 'france_metropolitaine') AS taux_france
    FROM revenus_territoires

# ------------------------------------------------------------------------------------------- SQL + statistiques

- id: T07
  categorie: sql_stats
  question: >-
    Au 2e trimestre 2026, le taux d'éligibilité FttH des communes est-il corrélé à leur population ? Donne la
    corrélation de Spearman sur les communes qui ont au moins un local.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, planificateur, relecteur]
  sql_reference: |
    SELECT c.population, 1.0 * f.locaux_eligibles_ftth / f.nb_locaux AS taux_ftth
    FROM fixe_technologies f JOIN communes c USING (code_insee)
    WHERE f.trimestre = '2026_T2' AND f.nb_locaux > 0
  calcul_reference: |
    df = resultats[0]
    valeurs = {"rho_spearman": round(stats.spearmanr(df.population, df.taux_ftth)[0], 3)}
  tolerance_abs: 0.01

- id: T08
  categorie: sql_stats
  question: >-
    Lors de la campagne ARCEP 2025, la part des pages web chargées en moins de 10 secondes diffère-t-elle entre
    zones denses et zones rurales ? Donne les deux taux, calculés sur les tests web, et teste la différence.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, planificateur, relecteur]
  sql_reference: |
    SELECT zone, page_web_moins_10s, count(*) AS tests FROM mobile_qos_mesures
    WHERE protocole = 'WEB' AND zone IN ('Zones denses', 'Zones rurales') GROUP BY ALL ORDER BY ALL
  calcul_reference: |
    table = resultats[0].pivot(index="zone", columns="page_web_moins_10s", values="tests")
    chi2, p, ddl, attendu = stats.chi2_contingency(table)
    valeurs = {"taux_denses_pct": round(100 * table.loc["Zones denses", True] / table.loc["Zones denses"].sum(), 1),
               "taux_rurales_pct": round(100 * table.loc["Zones rurales", True] / table.loc["Zones rurales"].sum(), 1),
               "p_valeur_inferieure_0_001": bool(p < 0.001)}
  mentions: ['significati']
  piege: Le taux se calcule sur les seuls tests web, pas sur tous les tests de la zone.

- id: T09
  categorie: sql_stats
  question: >-
    Lors de la campagne ARCEP 2025, quelle est la note moyenne de qualité audio (MOS) des appels voix, avec son
    intervalle de confiance à 95 % ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, planificateur, relecteur]
  sql_reference: |
    SELECT mos_moyen FROM mobile_qos_mesures WHERE protocole = 'VOIX' AND mos_moyen IS NOT NULL
  calcul_reference: |
    x = resultats[0].mos_moyen
    moyenne, erreur = x.mean(), stats.sem(x)
    bas, haut = stats.t.interval(0.95, len(x) - 1, loc=moyenne, scale=erreur)
    valeurs = {"mos_moyen": round(moyenne, 3), "ic95_bas": round(bas, 3), "ic95_haut": round(haut, 3),
               "ic95_demi_largeur": round((haut - bas) / 2, 3)}
  valeurs_attendues: [mos_moyen]
  mentions: ['intervalle']
  tolerance_abs: 0.005
  piege: L'intervalle est très étroit (des dizaines de milliers d'appels) ; seule la moyenne est vérifiée.

- id: T10
  categorie: sql_stats
  question: >-
    Le taux de pauvreté des départements de métropole est-il corrélé à leur part de locaux pouvant avoir au moins
    1 Gbit/s au 2e trimestre 2026 ? Donne la corrélation de Spearman.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, planificateur, relecteur]
  sql_reference: |
    SELECT t.code_geo, t.taux_pauvrete, 100.0 * sum(d.locaux_1g_ou_plus) / sum(d.nb_locaux) AS taux_1g_pct
    FROM fixe_debits d JOIN communes c USING (code_insee)
    JOIN revenus_territoires t ON t.niveau = 'departement' AND t.code_geo = c.dep_code
    WHERE d.trimestre = '2026_T2' AND c.dep_code NOT LIKE '97%' GROUP BY t.code_geo, t.taux_pauvrete
  calcul_reference: |
    df = resultats[0]
    valeurs = {"rho_spearman": round(stats.spearmanr(df.taux_pauvrete, df.taux_1g_pct)[0], 3)}
  tolerance_abs: 0.01

