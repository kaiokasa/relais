# ------------------------------------------------------------------------------------------- équipe complète

- id: T15
  categorie: equipe
  question: >-
    Les départements de métropole les plus pauvres ont-ils une part de locaux éligibles à la fibre FttH plus faible
    au 2e trimestre 2026 ? Montre la relation et mesure-la par une corrélation de Spearman.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, visualisation, planificateur, relecteur]
  sql_reference: |
    SELECT t.code_geo, t.taux_pauvrete, 100.0 * sum(f.locaux_eligibles_ftth) / sum(f.nb_locaux) AS taux_ftth_pct
    FROM fixe_technologies f JOIN communes c USING (code_insee)
    JOIN revenus_territoires t ON t.niveau = 'departement' AND t.code_geo = c.dep_code
    WHERE f.trimestre = '2026_T2' AND c.dep_code NOT LIKE '97%' GROUP BY t.code_geo, t.taux_pauvrete
  calcul_reference: |
    df = resultats[0]
    valeurs = {"rho_spearman": round(stats.spearmanr(df.taux_pauvrete, df.taux_ftth_pct)[0], 3)}
  tolerance_abs: 0.01
  graphique: {type: scatter}
  mentions: ['corr[ée]lation']

- id: T16
  categorie: equipe
  question: >-
    Lors de la campagne ARCEP 2025, le débit montant mesuré diffère-t-il selon le type de zone ? Montre les
    distributions, donne la médiane par zone et teste la différence.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, visualisation, planificateur, relecteur]
  sql_reference: |
    SELECT zone, debit_montant_mbps FROM mobile_qos_mesures
    WHERE protocole = 'UPLOAD' AND debit_montant_mbps IS NOT NULL
  calcul_reference: |
    groupes = {z: g.debit_montant_mbps for z, g in resultats[0].groupby("zone")}
    h, p = stats.kruskal(*groupes.values())
    valeurs = {f"mediane_{z}": round(g.median(), 1) for z, g in groupes.items()}
    valeurs["p_valeur_inferieure_0_001"] = bool(p < 0.001)
  graphique: {type: box, series: 4}
  mentions: ['significati']

- id: T17
  categorie: equipe
  question: >-
    Le nombre de jours pendant lesquels une indisponibilité de site reste visible dans les relevés diffère-t-il
    d'un opérateur de métropole à l'autre ? Montre les moyennes par opérateur et teste la différence.
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, statistiques, visualisation, planificateur, relecteur]
  sql_reference: |
    SELECT operateur, nb_jours_observes FROM mobile_pannes WHERE operateur_code IS NOT NULL
  calcul_reference: |
    groupes = {o: g.nb_jours_observes for o, g in resultats[0].groupby("operateur")}
    h, p = stats.kruskal(*groupes.values())
    valeurs = {f"moyenne_{o}": round(g.mean(), 2) for o, g in groupes.items()}
    valeurs["p_valeur_inferieure_0_001"] = bool(p < 0.001)
  graphique: {type: bar, series: 1}
  mentions: ['significati']
  interdits: ['meilleur opérateur']
  piege: Comparaison d'opérateurs à garder factuelle ; les pratiques de déclaration diffèrent.

# ------------------------------------------------------------------------------------------- plusieurs étapes

- id: T18
  categorie: multi_etapes
  question: >-
    Parmi les communes de métropole de plus de 20 000 habitants, laquelle a le plus faible taux d'éligibilité à la
    fibre FttH au 2e trimestre 2026, et combien d'indisponibilités de sites mobiles y ont été relevées sur la
    période couverte ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, sql, planificateur, relecteur]
  sql_reference:
    - |
      SELECT c.code_insee, c.nom AS commune, round(100.0 * f.locaux_eligibles_ftth / f.nb_locaux, 1) AS taux_ftth_pct
      FROM fixe_technologies f JOIN communes c USING (code_insee)
      WHERE f.trimestre = '2026_T2' AND c.population > 20000 AND c.dep_code NOT LIKE '97%'
      ORDER BY taux_ftth_pct LIMIT 1
    - |
      SELECT code_insee, count(*) AS indisponibilites FROM mobile_pannes GROUP BY code_insee
  calcul_reference: |
    top = resultats[0].iloc[0]
    pannes = resultats[1].set_index("code_insee").indisponibilites.get(top.code_insee, 0)
    valeurs = {"commune": top.commune, "taux_ftth_pct": float(top.taux_ftth_pct), "indisponibilites": int(pannes)}

- id: T19
  categorie: multi_etapes
  question: >-
    Quel département de métropole a le niveau de vie médian le plus élevé, et quelle part de ses locaux peut avoir
    au moins 1 Gbit/s au 2e trimestre 2026 ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, sql, planificateur, relecteur]
  sql_reference:
    - |
      SELECT t.code_geo AS dep_code, d.nom AS departement, t.niveau_vie_median
      FROM revenus_territoires t JOIN departements d ON d.dep_code = t.code_geo
      WHERE t.niveau = 'departement' ORDER BY t.niveau_vie_median DESC LIMIT 1
    - |
      SELECT c.dep_code, round(100.0 * sum(d.locaux_1g_ou_plus) / sum(d.nb_locaux), 1) AS taux_1g_pct
      FROM fixe_debits d JOIN communes c USING (code_insee) WHERE d.trimestre = '2026_T2' GROUP BY c.dep_code
  calcul_reference: |
    top = resultats[0].iloc[0]
    taux = resultats[1].set_index("dep_code").taux_1g_pct[top.dep_code]
    valeurs = {"departement": top.departement, "niveau_vie_median": int(top.niveau_vie_median),
               "taux_1g_pct": float(taux)}

- id: T20
  categorie: multi_etapes
  question: >-
    Combien de communes n'ont aucun site mobile déclaré sur leur territoire au 2e trimestre 2026, et quelle
    population totale y vit ?
  statut_attendu: repondu
  parcours_attendu: [planificateur, sql, sql, planificateur, relecteur]
  sql_reference:
    - |
      SELECT DISTINCT code_insee FROM mobile_sites WHERE trimestre = '2026_T2'
    - |
      SELECT code_insee, population FROM communes
  calcul_reference: |
    avec_site = set(resultats[0].code_insee)
    sans = resultats[1][~resultats[1].code_insee.isin(avec_site)]
    valeurs = {"communes": int(len(sans)), "population": int(sans.population.sum())}
  piege: Une commune sans site sur son territoire n'est pas forcément sans couverture mobile.

